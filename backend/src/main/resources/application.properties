spring.application.name=parking-management

spring.datasource.url=jdbc:mysql://localhost:3306/parking_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Include exception messages in error responses so the frontend can show them
server.error.include-message=always

# Login sessions: one attendant shift, cookie not readable by JavaScript or sent cross-site
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# First admin account, created only when the staff table is empty (see AdminAccountSeeder).
# Set ADMIN_USERNAME / ADMIN_PASSWORD in backend/.env; change the password after first login.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin12345}
